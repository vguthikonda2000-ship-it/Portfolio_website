<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="editor-page">
    <div class="editor-toolbar">
      <div class="toolbar-copy">
        <strong>Edit Mode</strong>
        <span>Click text to type. Click an image block to upload.</span>
      </div>
      <div class="toolbar-actions">
        <button id="save-button" type="button">Save Draft</button>
        <button id="reset-button" type="button" class="ghost">Reset Draft</button>
        <a href="../index.html" target="_blank" rel="noreferrer">Open Site</a>
      </div>
      <div class="toolbar-status" id="status-text">Loading draft…</div>
    </div>

    <div class="background-wallpaper" aria-hidden="true">
      <div class="wallpaper-row">
        <span class="wallpaper-icon icon-a"></span>
        <span class="wallpaper-icon icon-b"></span>
        <span class="wallpaper-icon icon-c"></span>
      </div>
      <div class="wallpaper-row">
        <span class="wallpaper-icon icon-d"></span>
        <span class="wallpaper-icon icon-e"></span>
        <span class="wallpaper-icon icon-f"></span>
      </div>
      <div class="wallpaper-row">
        <span class="wallpaper-icon icon-g"></span>
        <span class="wallpaper-icon icon-h"></span>
        <span class="wallpaper-icon icon-i"></span>
      </div>
    </div>

    <header class="site-header editor-header">
      <div class="container nav-shell">
        <a class="resume-link" id="resume-link" href="#contact">Resume</a>
        <nav class="main-nav" aria-label="Primary">
          <a href="#home">Home</a>
          <a href="#work">Work</a>
          <a href="#contact">Contact</a>
          <button class="lang-pill active" type="button">EN</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="section hero-section" id="home">
        <div class="container hero-grid">
          <div class="hero-copy">
            <p class="eyebrow editable" id="hero-eyebrow"></p>
            <h1>
              <span class="editable" id="hero-title-prefix"></span>
              <span class="type-line no-cursor">
                <span class="editable" id="hero-roles-inline"></span>
              </span>
            </h1>
            <p class="lede editable" id="hero-description"></p>
            <a class="primary-cta editable-link" id="hero-cta" href="#contact"></a>
          </div>
          <div class="hero-panel">
            <div class="portrait-card">
              <div class="portrait-glow"></div>
              <div class="portrait-badge editable" id="hero-badge"></div>
              <div class="portrait-art upload-target" id="hero-portrait"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="about">
        <div class="container about-grid">
          <div class="section-heading">
            <h2 class="editable" id="about-heading"></h2>
          </div>
          <div class="about-copy" id="about-paragraphs"></div>
        </div>
      </section>

      <section class="section" id="education">
        <div class="container">
          <div class="section-heading">
            <h2 class="editable" id="education-heading"></h2>
          </div>
          <div class="card-grid three-up" id="education-cards"></div>
        </div>
      </section>

      <section class="section" id="publications">
        <div class="container">
          <div class="section-heading">
            <h2 class="editable" id="publications-heading"></h2>
          </div>
          <div class="list-stack publication-stack" id="publication-cards"></div>
        </div>
      </section>

      <section class="section" id="internships">
        <div class="container">
          <div class="section-heading">
            <h2 class="editable" id="experience-heading"></h2>
          </div>
          <div class="card-grid two-up" id="experience-cards"></div>
        </div>
      </section>

      <section class="section" id="projects">
        <div class="container">
          <div class="section-heading">
            <h2 class="editable" id="projects-heading"></h2>
          </div>
          <div class="editable-stack" id="project-cards"></div>
        </div>
      </section>

      <section class="section" id="skills">
        <div class="container">
          <div class="section-heading">
            <h2 class="editable" id="skills-heading"></h2>
          </div>
          <div class="skills-grid" id="skills-grid"></div>
        </div>
      </section>

      <section class="section footer-section" id="contact">
        <div class="container footer-container">
          <h2 class="editable" id="contact-heading"></h2>
          <h3 class="editable" id="contact-subheading"></h3>
          <a class="email-link editable-link" id="contact-email" href="mailto:hello@example.com"></a>
          <div class="social-icons" id="social-links"></div>
          <p class="footer-note">
            <span class="editable" id="footer-prefix"></span>
            <a href="#home" class="editable-link" id="footer-name"></a>
          </p>
        </div>
      </section>
    </main>

    <input id="image-upload-input" class="sr-file-input" type="file" accept="image/*,video/*" />
    <script src="../content/default-content.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
